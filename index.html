<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elevation Software — EPS Dashboard</title>
<style>
  :root {
    --bg: #0E0F11; --surface: #1E2126; --text: #F7F3E9;
    --secondary: #CFC8B8; --hint: #B5AB93; --gold: #C8A86A;
    --gold-pressed: #A98F52; --outline: #8A7B5C; --on-gold: #191104;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  /* Anthony's rule (October 28, 2026): content starts low, with a
     real gap below the top of the screen — never jammed to the edge. */
  .page { max-width: 920px; margin: 0 auto; padding: 72px 24px 64px; }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 6px; }
  .sub { color: var(--secondary); font-size: 14px; margin-bottom: 22px; }
  .card {
    background: var(--surface); border: 1px solid var(--outline);
    border-radius: 10px; padding: 24px; margin-bottom: 24px;
  }
  label { display: block; font-size: 13px; color: var(--secondary); margin: 14px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 6px;
    border: 1px solid var(--outline); background: var(--bg);
    color: var(--text); font-size: 15px;
  }
  button {
    margin-top: 20px; padding: 10px 22px; border: 0; border-radius: 6px;
    background: var(--gold); color: var(--on-gold);
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:active { background: var(--gold-pressed); }
  button.ghost {
    background: transparent; color: var(--gold);
    border: 1px solid var(--gold); margin-top: 0;
  }
  .bar { margin-bottom: 18px; }
  .footbar { margin-top: 28px; display: flex; gap: 12px; flex-wrap: wrap; }
  /* Sign out is the reciprocal of the ghost buttons (Anthony,
     October 29, 2026): solid gold, black words — it stands out. */
  #signoutBtn { background: var(--gold); color: #191104; border-color: var(--gold); font-weight: 600; }
  #signoutBtn:hover { background: #A98F52; }
  .wizard-btn { position: relative; }
  .wizard-dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
  .wizard-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 11, 12, .72); z-index: 60; padding: 24px; }
  .wizard-overlay[hidden] { display: none; }
  .wizard-close { position: absolute; top: 10px; right: 12px; background: none; border: none; color: var(--hint); font-size: 20px; line-height: 1; padding: 6px; cursor: pointer; width: auto; }
  .wizard-close:hover { color: var(--gold); }
  .wizard-card { position: relative; background: var(--surface); border: 1px solid var(--outline); border-radius: 12px; max-width: 340px; width: 100%; padding: 30px 26px; text-align: center; animation: rise .45s ease-out; }
  .wizard-card p { font-size: 17px; line-height: 1.55; color: var(--text); }
  h2 { font-size: 19px; margin: 0 0 4px; }
  .orgkind { color: var(--hint); font-size: 13px; margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--hint); font-weight: 500; padding: 8px 10px 8px 0; }
  td { padding: 8px 10px 8px 0; border-top: 1px solid #2c2f36; color: var(--text); }
  td.dim, .dim { color: var(--secondary); }
  .err { color: #e8a0a0; font-size: 14px; margin-top: 14px; min-height: 18px; }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 64px; }
  .eye {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    margin: 0; padding: 6px 9px; background: transparent; border: 0;
    color: var(--secondary); font-size: 13px; letter-spacing: 0.04em; cursor: pointer;
  }
  .note { color: var(--hint); font-size: 13px; margin-top: 10px; }
  /* The page rises as it loads — one quiet fade-and-lift, then
     stillness. Anthony's pick (October 29, 2026). */
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  h1, .sub, .bar, .card, .footbar { animation: rise 0.6s ease-out both; }
  @media (prefers-reduced-motion: reduce) {
    h1, .sub, .bar, .card, .footbar { animation: none; }
  }
  /* Gold Rush (named by Anthony): a brief gold rain, on demand only — the
     button at the bottom of the signed-in view, named by Anthony
     (October 29, 2026). Coins, not bills: this is a quiet gold
     mine. One pass, a few seconds, then stillness again. */
  .rain { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
  .coin {
    position: absolute; top: -40px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #E8CE8F, #C8A86A 60%, #A98F52);
    color: #191104; display: flex; align-items: center; justify-content: center;
    font-weight: 700; animation-name: coinfall; animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  @keyframes coinfall {
    to { transform: translateY(112vh) rotate(320deg); }
  }
</style>
</head>
<body>
<div class="page">
  <h1>Elevation Software</h1>
  <div class="sub">EPS Dashboard</div>

  <div id="signin" class="card" hidden>
    <label for="email" id="emailLabel">Email</label>
    <input id="email" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="password">Password</label>
    <div class="pw-wrap">
      <input id="password" type="password" autocomplete="current-password">
      <button id="pwToggle" type="button" class="eye" aria-label="Show password">Show</button>
    </div>
    <button id="signinBtn">Sign in</button>
    <div id="signinErr" class="err"></div>
  </div>

  <div id="fleet" hidden>
    <div class="bar">
      <div class="dim" id="who"></div>
    </div>
    <div id="orgs"></div>
    <div class="footbar">
      <button id="wizardBtn" class="ghost wizard-btn" hidden>The Wizard<span id="wizardDot" class="wizard-dot" hidden></span></button>
      <button id="rainBtn" class="ghost">Gold Rush</button>
      <button id="signoutBtn" class="ghost">Sign out</button>
    </div>
    <div id="fleetErr" class="err"></div>
  </div>
</div>

<script src="config.js"></script>
<div id="wizardOverlay" class="wizard-overlay" hidden>
  <div class="wizard-card"><button id="wizardClose" class="wizard-close" aria-label="Close">&times;</button><p id="wizardText"></p></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const cfg = window.EPS_CONFIG || {};
const configured = cfg.url && cfg.anonKey && !cfg.anonKey.includes("PASTE");
const client = (configured && window.supabase)
  ? supabase.createClient(cfg.url, cfg.anonKey)
  : null;
const eps = () => client.schema("eps");

function show(id) { document.getElementById(id).hidden = false; }
function hide(id) { document.getElementById(id).hidden = true; }
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function when(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  return d.toLocaleString();
}

function moneyRain() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const layer = document.createElement("div");
  layer.className = "rain";
  for (let i = 0; i < 36; i++) {
    const c = document.createElement("div");
    c.className = "coin";
    const size = 13 + Math.random() * 14;
    c.style.width = size + "px";
    c.style.height = size + "px";
    c.style.left = (Math.random() * 100) + "vw";
    c.style.animationDuration = (1.8 + Math.random() * 1.4) + "s";
    c.style.animationDelay = (Math.random() * 0.6) + "s";
    c.style.opacity = 0.75 + Math.random() * 0.25;
    if (i % 3 === 0) {
      c.textContent = "$";
      c.style.fontSize = (size * 0.62) + "px";
    }
    layer.appendChild(c);
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 4200);
}

async function loadFleet(user) {
  hide("signin"); show("fleet");
  document.getElementById("who").textContent =
    (user.user_metadata && user.user_metadata.display_name) || user.email;
  const err = document.getElementById("fleetErr");
  err.textContent = "";
  // Every read's error is checked (TA's Step 8C review finding):
  // a failed read is surfaced by name and its figures render as
  // unknown — never silently treated as empty or healthy.
  const reads = await Promise.all([
      eps().from("organizations").select("id, slug, display_name, is_root_authority, is_test").order("display_name"),
      eps().from("system_units").select("id, organization_id, unit_key, status"),
      eps().from("fleet_label_assignments").select("system_unit_id, label").is("unassigned_at", null),
      eps().from("unit_runtime_state").select("system_unit_id, current_platform, updated_at"),
      eps().from("heartbeats").select("system_unit_id, recorded_at").order("recorded_at", { ascending: false }).limit(500),
      eps().from("billing_periods").select("organization_id, service_month, billing_state").order("service_month", { ascending: false }),
      eps().from("notice_outbox").select("organization_id, state"),
    ]);
  const names = ["organizations", "units", "labels", "runtime state",
                 "heartbeats", "billing periods", "notices"];
  const failed = names.filter((_, i) => reads[i].error);
  const unitsFailed = !!reads[1].error;
  const noticesFailed = !!reads[6].error;
  const [orgs, units, labels, runtime, beats, periods, notices] =
    reads.map(r => r.data);
  if (reads[0].error) { err.textContent = reads[0].error.message; return; }
  if (failed.length) {
    err.textContent = "Some data could not be loaded (" +
      failed.join(", ") + ") — what is shown may be incomplete.";
  }
  // Account state comes from the system's own computation
  // (eps.account_org_entitlement_state), one call per visible
  // organization; a failed or empty answer renders "unknown".
  const stateOf = {};
  await Promise.all((orgs || []).map(async org => {
    const { data, error } = await eps().rpc(
      "account_org_entitlement_state", { p_organization_id: org.id });
    stateOf[org.id] = error ? null : data;
  }));
  const labelOf = {}, runtimeOf = {}, lastBeat = {}, periodOf = {}, noticeCount = {};
  (labels || []).forEach(r => { labelOf[r.system_unit_id] = r.label; });
  (runtime || []).forEach(r => { runtimeOf[r.system_unit_id] = r; });
  (beats || []).forEach(r => { if (!lastBeat[r.system_unit_id]) lastBeat[r.system_unit_id] = r.recorded_at; });
  (periods || []).forEach(r => { if (!periodOf[r.organization_id]) periodOf[r.organization_id] = r; });
  (notices || []).forEach(r => {
    if (r.state !== "sent") noticeCount[r.organization_id] = (noticeCount[r.organization_id] || 0) + 1;
  });

  const host = document.getElementById("orgs");
  host.innerHTML = "";
  if (!orgs || orgs.length === 0) {
    host.innerHTML = '<div class="card">This account has no access.' +
      '<div class="note">Access is granted by membership — ask the operator to provision this account.</div></div>';
    return;
  }
  // Test organizations (designated in the data, S6B) are kept
  // out of the fleet view; the exclusion itself is shown, never
  // silent. Their records stay in the system untouched.
  const testCount = orgs.filter(o => o.is_test).length;
  const fleets = orgs.filter(o => !o.is_test);
  fleets.forEach(org => {
    const rows = (units || []).filter(u => u.organization_id === org.id).map(u => {
      const rt = runtimeOf[u.id] || {};
      return "<tr><td>" + esc(labelOf[u.id] || u.unit_key) + "</td>" +
        "<td>" + esc(u.status) + "</td>" +
        "<td class='dim'>" + esc(rt.current_platform || "—") + "</td>" +
        "<td class='dim'>" + when(lastBeat[u.id] || rt.updated_at) + "</td></tr>";
    }).join("");
    const period = periodOf[org.id];
    const billing = org.is_root_authority
      ? "Owner organization — not billed"
      : (periods === null ? "unknown"
        : (period ? esc(period.service_month) + " · " + esc(period.billing_state)
                  : "No billing period yet"));
    const accountState = stateOf[org.id] === "owner"
      ? "owner authority"
      : (stateOf[org.id] || "unknown");
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      "<h2>" + esc(org.display_name) + "</h2>" +
      "<div class='orgkind'>" + (org.is_root_authority ? "Owner" : "Client") +
        " · Account: " + esc(accountState) +
        " · Billing: " + billing +
        (noticesFailed ? " · Unsent notices: unknown"
          : (noticeCount[org.id] ? " · Unsent notices: " + noticeCount[org.id] : "")) +
      "</div>" +
      (unitsFailed
        ? "<div class='note'>Units unavailable — the units read failed.</div>"
        : (rows
          ? "<table><tr><th>Unit</th><th>Status</th><th>Platform</th><th>Last activity</th></tr>" + rows + "</table>"
          : "<div class='note'>No units yet.</div>"));
    host.appendChild(card);
  });
  // Test organizations stay excluded from the display, silently —
  // at Anthony's direction (October 29, 2026) the "not shown" line
  // itself was removed from the page. The count is still computed
  // above; nothing about the exclusion changed, only its announcement.
}

async function boot() {
  const err = document.getElementById("signinErr");
  if (!window.supabase) {
    show("signin");
    err.textContent = "The sign-in library could not be loaded — check your connection and reopen the page.";
    return;
  }
  if (cfg.usernameSignIn) {
    document.getElementById("emailLabel").textContent = "Email or username";
  }
  if (!configured) {
    show("signin");
    err.textContent =
      "Dashboard not configured yet — the project anon key goes in config.js.";
    return;
  }
  try {
    const { data: { session } } = await client.auth.getSession();
    if (session) loadFleet(session.user); else show("signin");
  } catch (e) {
    show("signin");
    err.textContent = "Could not reach the sign-in service: " + (e && e.message ? e.message : e);
  }
}

document.getElementById("pwToggle").addEventListener("click", () => {
  const pw = document.getElementById("password");
  const showing = pw.type === "text";
  pw.type = showing ? "password" : "text";
  const btn = document.getElementById("pwToggle");
  btn.textContent = showing ? "Show" : "Hide";
  btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
});

document.getElementById("signinBtn").addEventListener("click", async () => {
  const err = document.getElementById("signinErr");
  const btn = document.getElementById("signinBtn");
  err.textContent = "";
  if (!client) {
    err.textContent = "Dashboard not configured yet — the project anon key goes in config.js.";
    return;
  }
  btn.disabled = true;
  btn.textContent = "Signing in…";
  try {
    // Sign-in accepts an email, and — once the username gate is
    // live and config enables it — a username. A username is one
    // word (Anthony's rule, October 29, 2026): normalized here
    // (lowercased, spaces stripped), then sent WITH the password
    // to the eps-username-signin function, which resolves the
    // account email on the server and performs the password check
    // there. The email never reaches the browser, and every
    // failure — unknown username or wrong password — returns the
    // same generic message. (TA's condition on PR #51: no
    // anon-callable email lookup; the audited anon boundary holds.)
    const identifier = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (!identifier.includes("@") && cfg.usernameSignIn) {
      const username = identifier.toLowerCase().replace(/\s+/g, "");
      const resp = await fetch(cfg.url + "/functions/v1/eps-username-signin", {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": cfg.anonKey },
        body: JSON.stringify({ username, password }),
      });
      const payload = await resp.json().catch(() => null);
      if (!resp.ok || !payload || !payload.access_token || !payload.refresh_token) {
        err.textContent = "Invalid login credentials";
        return;
      }
      const session = await client.auth.setSession({
        access_token: payload.access_token,
        refresh_token: payload.refresh_token,
      });
      if (session.error || !session.data.user) {
        err.textContent = "Invalid login credentials";
        return;
      }
      await loadFleet(session.data.user);
      return;
    }
    const { data, error } = await client.auth.signInWithPassword({
      email: identifier,
      password: document.getElementById("password").value,
    });
    if (error) {
      err.textContent = error.message;
      return;
    }
    if (!data || !data.user) {
      err.textContent = "Sign-in did not complete — please try again.";
      return;
    }
    await loadFleet(data.user);
  } catch (e) {
    err.textContent = "Sign-in failed: " + (e && e.message ? e.message : e);
  } finally {
    btn.disabled = false;
    btn.textContent = "Sign in";
  }
});
// The Wizard (Anthony's feature, October 29, 2026): a button in
// the footbar that opens a small, bare card holding ONE sentence
// of his, set in config (wizardText / wizardVersion). It changes
// only when he changes it. A gold dot rests on the button while
// the current sentence is unseen on this device; reading clears
// it. Visible to every signed-in account - built mostly for the
// client, seen by the owner too (his direction).
(function initWizard() {
  const text = (cfg.wizardText || "").trim();
  if (!text || !cfg.wizardVersion) return;
  const btn = document.getElementById("wizardBtn");
  const dot = document.getElementById("wizardDot");
  const overlay = document.getElementById("wizardOverlay");
  document.getElementById("wizardText").textContent = text;
  btn.hidden = false;
  let seen = 0;
  try { seen = Number(localStorage.getItem("epsWizardSeen") || 0); } catch (e) {}
  if (seen < cfg.wizardVersion) dot.hidden = false;
  btn.addEventListener("click", () => {
    overlay.hidden = false;
    dot.hidden = true;
    try { localStorage.setItem("epsWizardSeen", String(cfg.wizardVersion)); } catch (e) {}
  });
  overlay.addEventListener("click", () => { overlay.hidden = true; });
  document.getElementById("wizardClose").addEventListener("click", (ev) => {
    ev.stopPropagation();
    overlay.hidden = true;
  });
})();

document.getElementById("rainBtn").addEventListener("click", moneyRain);

document.getElementById("signoutBtn").addEventListener("click", async () => {
  await client.auth.signOut();
  location.reload();
});
boot();
</script>
</body>
</html>
