<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elevation Software — EPS Dashboard</title>
<style>
  :root {
    --bg: #0E0F11; --surface: #1E2126; --text: #F7F3E9;
    --secondary: #CFC8B8; --hint: #B5AB93; --gold: #C8A86A;
    --gold-pressed: #A98F52; --outline: #8A7B5C; --on-gold: #191104;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  /* Anthony's rule (October 28, 2026): content starts low, with a
     real gap below the top of the screen — never jammed to the edge. */
  .page { max-width: 920px; margin: 0 auto; padding: 72px 24px 64px; }
  /* The brand mark (Step 7 Part 4): the approved gold rook
     replaces the two-line text header outright. Its height
     matches the block it replaces, measured from that block's
     CSS — the 26px title line (~31px at normal line height),
     the 6px gap, and the 14px subtitle line (~17px) = 54px —
     and it keeps the subtitle's 22px margin below, so the page
     rhythm is unchanged. The image is a 256px downscale of the
     approved transparent PNG, embedded as a data URI so the
     dashboard stays one published file. */
  .brand { display: block; height: 54px; width: auto; margin-bottom: 22px; }
  .card {
    background: var(--surface); border: 1px solid var(--outline);
    border-radius: 10px; padding: 24px; margin-bottom: 24px;
  }
  label { display: block; font-size: 13px; color: var(--secondary); margin: 14px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 6px;
    border: 1px solid var(--outline); background: var(--bg);
    color: var(--text); font-size: 15px;
  }
  button {
    margin-top: 20px; padding: 10px 22px; border: 0; border-radius: 6px;
    background: var(--gold); color: var(--on-gold);
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:active { background: var(--gold-pressed); }
  button.ghost {
    background: transparent; color: var(--gold);
    border: 1px solid var(--gold); margin-top: 0;
  }
  /* The bar carries position + z-index so the menu panel paints
     ABOVE the company cards: the entrance animation gives every
     card its own stacking layer, and without this the panel
     opened behind them (Anthony's screenshot, October 29, 2026). */
  .bar { margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 70; }
  .menu-wrap { position: relative; }
  .menu-btn { position: relative; width: auto; padding: 7px 13px; background: var(--surface); border: 1px solid var(--outline); border-radius: 10px; color: var(--text); font-size: 17px; line-height: 1.2; cursor: pointer; }
  .menu-panel { position: absolute; right: 0; top: calc(100% + 8px); background: var(--surface); border: 1px solid var(--outline); border-radius: 12px; min-width: 204px; padding: 6px; z-index: 50; box-shadow: 0 12px 32px rgba(0, 0, 0, .5); }
  .menu-panel[hidden] { display: none; }
  .menu-item { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text); padding: 11px 12px; font-size: 15px; border-radius: 8px; cursor: pointer; margin: 0; }
  .menu-item:hover { background: #26292f; }
  .menu-item.gold { background: var(--gold); color: #191104; font-weight: 600; text-align: center; margin-top: 6px; }
  .menu-item.gold:hover { background: #A98F52; }
  .wizard-dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
  .wizard-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 11, 12, .72); z-index: 60; padding: 24px; }
  .wizard-overlay[hidden] { display: none; }
  .wizard-close { position: absolute; top: 10px; right: 12px; background: none; border: none; color: var(--hint); font-size: 20px; line-height: 1; padding: 6px; cursor: pointer; width: auto; }
  .wizard-close:hover { color: var(--gold); }
  .wizard-card { position: relative; background: var(--surface); border: 1px solid var(--outline); border-radius: 12px; max-width: 340px; width: 100%; padding: 30px 26px; text-align: center; animation: rise .45s ease-out; }
  .wizard-card p { font-size: 17px; line-height: 1.55; color: var(--text); }
  .orgkind { color: var(--hint); font-size: 13px; margin-bottom: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--hint); font-weight: 500; padding: 8px 10px 8px 0; }
  td { padding: 8px 10px 8px 0; border-top: 1px solid #2c2f36; color: var(--text); }
  td.dim, .dim { color: var(--secondary); }
  .err { color: #e8a0a0; font-size: 14px; margin-top: 14px; min-height: 18px; }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 64px; }
  .eye {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    margin: 0; padding: 6px 9px; background: transparent; border: 0;
    color: var(--secondary); font-size: 13px; letter-spacing: 0.04em; cursor: pointer;
  }
  .note { color: var(--hint); font-size: 13px; margin-top: 10px; }
  button:disabled { opacity: .55; cursor: default; }
  /* Fleet controls (Step 7 Part 2): one quiet block directly
     under each unit's row — the remote half of the control
     surface the phone itself carries. Every control is
     rectangular with rounded corners at ~20% of its height
     (Anthony's standing rule): 34px controls, 7px radius. */
  .ctl-row td { border-top: 0; padding-top: 2px; }
  .ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .ctl-btn {
    margin: 0; height: 34px; padding: 0 14px; border-radius: 7px;
    background: transparent; color: var(--gold);
    border: 1px solid var(--gold);
    font-size: 12.5px; font-weight: 600; letter-spacing: .04em;
  }
  .ctl-btn:active { background: #26292f; }
  .ctl-btn.primary { background: var(--gold); color: var(--on-gold); }
  .ctl-btn.primary:active { background: var(--gold-pressed); }
  .seg { display: inline-flex; }
  .seg button {
    margin: 0; height: 34px; padding: 0 12px; border-radius: 0;
    background: transparent; color: var(--secondary);
    border: 1px solid var(--outline);
    font-size: 12.5px; font-weight: 600; letter-spacing: .04em;
  }
  .seg button:first-child { border-radius: 7px 0 0 7px; }
  .seg button:last-child { border-radius: 0 7px 7px 0; border-left: 0; }
  .seg button:active { background: #26292f; }
  .seg button.on { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
  .seg button.on:active { background: var(--gold-pressed); }
  .badge {
    display: inline-block; margin-left: 8px; padding: 2px 8px;
    border: 1px solid var(--gold); border-radius: 5px; color: var(--gold);
    font-size: 11px; font-weight: 700; letter-spacing: .06em; vertical-align: 2px;
  }
  .cmd-line { font-size: 12.5px; color: var(--hint); margin-top: 8px; min-height: 15px; }
  .cmd-line.bad { color: #e8a0a0; }
  /* Fleet depth + critical alerts (Step 7 Part 3): the app
     version sits small under the unit's name; the playing entry
     sits small under the PLAYING word; the alerts area is one
     quiet card that exists only while a condition stands. */
  .ver { color: var(--hint); font-size: 12px; margin-top: 3px; }
  .sub-line { color: var(--secondary); font-size: 12.5px; margin-top: 3px; }
  .alerts {
    background: var(--surface); border: 1px solid var(--gold);
    border-radius: 10px; padding: 18px 24px; margin-bottom: 24px;
    animation: rise 0.6s ease-out both;
  }
  .alert-title { color: var(--gold); font-size: 13px; font-weight: 700; letter-spacing: .08em; margin-bottom: 8px; }
  .alert-line { font-size: 14px; padding: 4px 0; }
  /* Step 7 Part 4 — the finishing pieces.
     Queue reset: the quiet sibling on the controls row — same
     34px / 7px rounding as every control, but in the secondary
     voice; its confirming state takes the gold edge so the
     second press is a deliberate one. */
  .ctl-btn.quiet { color: var(--secondary); border-color: var(--outline); }
  .ctl-btn.quiet.confirming { color: var(--gold); border-color: var(--gold); }
  /* Growth layout: each company is ONE summary line that
     expands to its full card. The summary is a real button
     (keyboard and tap alike) with the global button styling
     fully reset — it reads as the card's own header line. */
  .org-summary {
    display: flex; align-items: baseline; width: 100%;
    margin: 0; padding: 0; background: none; border: 0;
    color: var(--text); font-family: inherit; text-align: left;
    cursor: pointer;
  }
  .org-name { font-size: 19px; font-weight: 700; }
  .org-counts { color: var(--hint); font-size: 13px; margin-left: 12px; letter-spacing: .03em; }
  .chev { color: var(--gold); margin-left: auto; font-size: 15px; padding-left: 12px; }
  .org-body { margin-top: 4px; }
  .org-body[hidden] { display: none; }
  .fleet-search { margin-bottom: 18px; }
  /* Usage: the company's own check-in count against its
     allotment — a quiet line and a thin gold bar. */
  .usage { margin-bottom: 14px; }
  .usage-line { font-size: 12.5px; color: var(--secondary); letter-spacing: .04em; }
  .usage-bar { height: 4px; background: #2c2f36; border-radius: 2px; margin-top: 6px; }
  .usage-fill { height: 100%; background: var(--gold); border-radius: 2px; }
  /* Phone grid tidy (Anthony's decision, November 4, 2026):
     at phone width the controls stop wrapping unevenly and
     take an even two-column grid — the platform switch spans
     the full row, START/STOP share the next, RESTART and
     DISABLE/ENABLE the next, RESET QUEUE spans beneath — so
     the right edge lines up. Desktop layout is untouched. */
  @media (max-width: 640px) {
    .ctl { display: grid; grid-template-columns: 1fr 1fr; }
    .ctl .seg { grid-column: 1 / -1; display: flex; }
    .ctl .seg button { flex: 1; }
    .ctl-btn { width: 100%; }
    .ctl-btn.reset { grid-column: 1 / -1; }
  }
  /* The page rises as it loads — one quiet fade-and-lift, then
     stillness. Anthony's pick (October 29, 2026). */
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .brand, .bar, .card { animation: rise 0.6s ease-out both; }
  @media (prefers-reduced-motion: reduce) {
    .brand, .bar, .card { animation: none; }
  }
  /* Gold Rush (named by Anthony): a brief gold rain, on demand only — the
     button at the bottom of the signed-in view, named by Anthony
     (October 29, 2026). Coins, not bills: this is a quiet gold
     mine. One pass, a few seconds, then stillness again. */
  .rain { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
  .coin {
    position: absolute; top: -40px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #E8CE8F, #C8A86A 60%, #A98F52);
    color: #191104; display: flex; align-items: center; justify-content: center;
    font-weight: 700; animation-name: coinfall; animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  @keyframes coinfall {
    to { transform: translateY(112vh) rotate(320deg); }
  }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const cfg = window.EPS_CONFIG || {};
const configured = cfg.url && cfg.anonKey && !cfg.anonKey.includes("PASTE");
const client = (configured && window.supabase)
  ? supabase.createClient(cfg.url, cfg.anonKey)
  : null;
const eps = () => client.schema("eps");

function show(id) { document.getElementById(id).hidden = false; }
function hide(id) { document.getElementById(id).hidden = true; }
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function when(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  return d.toLocaleString();
}

// Fleet controls (Step 7 Part 2) — the dashboard half of the
// command road Part 1 built (migration 20261103120000). The one
// write is the definer eps.enqueue_unit_command: a closed
// command set; a per-type payload contract (start_session may
// carry {platform} — 'apple_music' or 'youtube'; every other
// type takes {}); coded refusals (P0523 not permitted — an
// unknown unit answers identically, P0524 invalid, P0525 key
// conflict); and idempotency — the key names the intended
// command, so a retry of the SAME press reuses its key and the
// server returns the standing command instead of duplicating
// it, while a fresh press mints a fresh key.
//
// The definer takes the actor's user id explicitly and grants
// EXECUTE to the server runtime role only: by Part 1's design
// its caller is the dashboard boundary, which proves the actor
// server-side. This page therefore never calls the definer
// directly and never sends an actor id — it invokes the
// boundary function eps-unit-command with the four command
// facts, and the boundary derives the actor from this page's
// verified session token before calling the definer. The
// function's coded answers ({ code: "P0523" } and its kin,
// on their mapped statuses) drive the same status lines the
// definer's codes did.
//
// The phone applies commands at its check-in (~5 minutes), so
// states advance asynchronously — a command can be ACKNOWLEDGED
// at one check-in and only COMPLETED at the next. The line
// under a unit shows its latest command as "TYPE — STATE ·
// outcome"; after an enqueue the page follows THAT command,
// polling once a minute until it reaches a terminal state
// (completed / failed / expired) or a bounded ~15 minutes pass
// — three check-in cycles with margin. Each command is tracked
// under its own id, so a later command never cancels an earlier
// command's tracking, and the line always follows the newest
// command: a late poll for an older command cannot overwrite
// it. The same poll re-reads the unit's operator_disabled
// flag, so the DISABLE/ENABLE swap and the DISABLED badge stay
// true on the open page — whether the change came from a
// command sent here, from the phone, or from another operator
// — without a page reload.
const CMD_LABEL = {
  start_session: "START", stop_session: "STOP",
  restart_runtime: "RESTART", disable_unit: "DISABLE",
  enable_unit: "ENABLE",
};
let actorId = null;
const unitPlatform = {};  // unit id -> 'apple_music' | 'youtube' (the START override)
const sentCmds = {};      // unit id -> {type, state, code} enqueued this session
const pressKeys = {};     // unit id + '|' + type -> idempotency key of an unconfirmed press
const CMD_POLL_MS = 60000;   // poll cadence while a command is in flight
const CMD_POLL_MAX = 15;     // ~15 minutes of polling, then the last known state stands
const CMD_TERMINAL = { completed: true, failed: true, expired: true };
const trackedCmds = {};   // command id -> {unitId, polls, timer}: one tracker per command
const lineShown = {};     // unit id -> {id, seq}: the command the status line currently reflects
const unitDisabled = {};  // unit id -> bool: operator_disabled as currently rendered

// Fleet depth + critical alerts (Step 7 Part 3) — the viewing
// half of the dashboard. Since Part 3's migration the phone
// reports its runtime facts at every check-in (its LOCAL
// disabled flag, its selected platform, whether it is
// conducting and which entry, in eps.unit_runtime_state) and
// the server stamps the unit's last check-in there on every
// proven check-in — so Platform, Last activity, and a deepened
// Status render from facts instead of standing empty. The
// alerts area derives only from what this page can read: a
// unit silent past the threshold below, a failed latest
// command, a disable standing from either source, an
// organization suspended or revoked. It renders only while at
// least one condition stands.
const UNIT_SILENCE_MS = 20 * 60 * 1000;  // a unit is silent after 20 minutes without a check-in
const unitStatusHtml = {};  // unit id -> the status cell's rendered depth (restored when a server disable lifts)

// Step 7 Part 4 — the finishing pieces.
//
// Queue reset: the operator can take back a unit's undelivered
// commands from the dashboard. It rides the SAME boundary as
// the enqueue (eps-unit-command, action "reset_queue") to the
// definer eps.reset_unit_command_queue, which expires the
// unit's PENDING commands only and answers how many it moved.
// A reset carries no idempotency key: the operation is defined
// entirely by the standing state it acts on, so repeating it
// moves nothing and answers 0 — idempotency is intrinsic. The
// control confirms INLINE (the button itself asks CONFIRM
// RESET? for a few seconds) — this page has no modal dialogs.
//
// Growth layout + search: each company renders as ONE summary
// line (name, unit count, how many in each standing state, an
// alert count when any stand) that expands to the full card.
// The default is the calm one: a company stands EXPANDED only
// when it has an alert or a unit playing — everything else
// opens collapsed and the counts do the talking, so the page
// opens quiet and what needs eyes is already open. The search
// field filters companies and units by name as you type; a
// unit match force-expands its company while the query stands,
// without overwriting the operator's own expansion choices.
//
// Usage: the metered resource is Edge Function invocations;
// per-company usage is counted from EPS's own records — one
// count per proven check-in, accumulated per organization per
// day in eps.usage_daily. The month's figure is summed
// SERVER-SIDE by eps.usage_month_checkins (the Part 4
// correction): exact at any table size, never a client-side
// sum over a capped row read. The line therefore reads
// CHECK-INS: the per-organization proxy EPS counts, never
// Supabase's project total. The allotment is Anthony's settled model:
// 200,000 a month on the Free plan, 1,000,000 on Pro. The
// current plan state is named in ONE place — flipping to Pro
// changes USAGE_ALLOTMENT and nothing else. Display only: no
// billing math lives here.
const FREE_ALLOTMENT = 200000;
const PRO_ALLOTMENT = 1000000;
const USAGE_ALLOTMENT = FREE_ALLOTMENT;
const orgExpanded = {};    // org id -> bool: the operator's (or the default's) expansion choice
const searchForce = new Set();  // org ids a unit-match in the search holds open while the query stands
const resetTimers = {};    // unit id -> the confirm state's revert timer
let renderedOrgs = [];     // org ids rendered by the latest loadFleet, in display order

// The runtime table stores its own platform vocabulary
// ('apple' | 'youtube'); the display names the platform in full.
function platLabel(stored) {
  if (stored === "apple") return "APPLE MUSIC";
  if (stored === "youtube") return "YOUTUBE";
  return stored ? String(stored).toUpperCase() : "—";
}

// Last activity: relative first, the clock time second —
// "6M AGO · 12:41 AM"; a fresh stamp reads "JUST NOW".
function lastActivityText(rt) {
  const ts = rt && rt.last_checkin_at;
  if (!ts) return "—";
  const d = new Date(ts);
  if (isNaN(d.getTime())) return "—";
  const clock = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const diff = Date.now() - d.getTime();
  if (diff < 90 * 1000) return "JUST NOW · " + clock;
  if (diff < 60 * 60 * 1000) return Math.max(1, Math.floor(diff / 60000)) + "M AGO · " + clock;
  if (diff < 24 * 60 * 60 * 1000) return Math.floor(diff / 3600000) + "H AGO · " + clock;
  return Math.floor(diff / 86400000) + "D AGO · " + clock;
}

// A silence duration in plain words, for the alert line.
function durationWords(ms) {
  const mins = Math.floor(ms / 60000);
  if (mins < 60) return mins + " MIN";
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + (hrs === 1 ? " HOUR" : " HOURS");
  const days = Math.floor(hrs / 24);
  return days + (days === 1 ? " DAY" : " DAYS");
}

// The deepened status: the unit's lifecycle word stands for a
// unit that is not active; under active, the two disable
// sources outrank conducting (a disable stops the session), and
// the LOCAL source is named so the two stay distinguishable —
// the server flag's word is plain DISABLED, matching the badge
// and the phone's own "disabled from the dashboard" face.
function unitStatusOf(u, rt) {
  if (u.status !== "active") {
    return { word: String(u.status || "").toUpperCase(), entry: null };
  }
  if (u.operator_disabled) return { word: "DISABLED", entry: null };
  if (rt.local_disabled) return { word: "DISABLED (ON DEVICE)", entry: null };
  if (rt.conducting) return { word: "PLAYING", entry: rt.current_entry || null };
  return { word: "READY", entry: null };
}

function cmdLineText(rec) {
  if (!rec || !rec.type) return "";
  return (CMD_LABEL[rec.type] || rec.type) + " — " +
    String(rec.state || "").toUpperCase() +
    (rec.code ? " · " + rec.code : "");
}
function setCmdLine(unitId, text, isErr) {
  const el = document.getElementById("cmd-" + unitId);
  if (!el) return;
  el.textContent = text;
  el.classList.toggle("bad", !!isErr);
}

function writeCmdLine(unitId, row) {
  // The line follows the NEWEST command for the unit, and only
  // that command. delivery_seq is the server's own ordering:
  // a read whose command is older than the one the line
  // already shows (an earlier command's poll landing late)
  // writes nothing. A command enqueued this session counts as
  // newest from the moment it is sent; until a read sequences
  // it, only its own reads may move the line.
  const shown = lineShown[unitId];
  if (shown && row.id && shown.id === row.id) {
    if (row.seq != null) shown.seq = row.seq;
  } else if (shown && shown.id && row.id && shown.seq == null) {
    return;
  } else if (shown && shown.seq != null && row.seq != null &&
             row.seq < shown.seq) {
    return;
  }
  lineShown[unitId] = {
    id: row.id || (shown && shown.id) || null,
    seq: row.seq != null ? row.seq : (shown ? shown.seq : null),
  };
  setCmdLine(unitId, cmdLineText(row), false);
}

function applyUnitFlag(unitId, dis) {
  // The DISABLED presentation, mutated on the standing nodes —
  // the same facts loadFleet renders (the badge, the
  // DISABLE/ENABLE swap, which button is primary, and — since
  // Part 3 — the status cell's word) — so the open page
  // corrects itself with no reload. The swap button's click
  // handler reads data-cmd at click time, so retargeting the
  // standing button is the whole change. When the server flag
  // lifts, the status cell restores the depth loadFleet
  // rendered for the unit (READY, PLAYING, or the on-device
  // disable's own wording).
  const badge = document.getElementById("unitbadge-" + unitId);
  if (badge) badge.innerHTML = dis ? "<span class='badge'>DISABLED</span>" : "";
  const statusCell = document.getElementById("statuscell-" + unitId);
  if (statusCell) {
    statusCell.innerHTML = dis
      ? "DISABLED"
      : (unitStatusHtml[unitId] || statusCell.innerHTML);
  }
  const flagBtn = document.getElementById("flagbtn-" + unitId);
  if (flagBtn) {
    flagBtn.dataset.cmd = dis ? "enable_unit" : "disable_unit";
    flagBtn.textContent = dis ? "ENABLE UNIT" : "DISABLE UNIT";
    flagBtn.classList.toggle("primary", dis);
  }
  const startBtn = document.getElementById("startbtn-" + unitId);
  if (startBtn) startBtn.classList.toggle("primary", !dis);
}

async function refreshUnitFlag(unitId) {
  // Re-read the unit's operator_disabled and, if it no longer
  // matches what the row shows, correct the row in place —
  // however the flag changed.
  try {
    const { data, error } = await eps().from("system_units")
      .select("operator_disabled").eq("id", unitId).limit(1);
    if (error || !data || !data.length) return;
    const dis = !!data[0].operator_disabled;
    if (unitDisabled[unitId] === dis) return;
    unitDisabled[unitId] = dis;
    applyUnitFlag(unitId, dis);
  } catch (e) { /* the standing presentation stays as it was */ }
}

function trackCommand(unitId, cmdId) {
  // One tracker per command id: a later command — on this unit
  // or any other — gets its own tracker and never disturbs
  // this one.
  if (trackedCmds[cmdId]) return;
  const tr = { unitId, polls: 0, timer: null };
  trackedCmds[cmdId] = tr;
  tr.timer = setTimeout(() => pollCommand(cmdId), CMD_POLL_MS);
}

async function pollCommand(cmdId) {
  const tr = trackedCmds[cmdId];
  if (!tr) return;
  const unitId = tr.unitId;
  tr.polls += 1;
  let mine = null;
  try {
    const { data, error } = await eps().from("commands")
      .select("id, command_type, state, result, delivery_seq")
      .eq("id", cmdId).limit(1);
    if (!error && data && data.length) mine = data[0];
  } catch (e) { /* a failed read changes nothing; the bound still applies */ }
  if (mine) {
    writeCmdLine(unitId, {
      id: mine.id, seq: mine.delivery_seq, type: mine.command_type,
      state: mine.state, code: mine.result && mine.result.code,
    });
  }
  // The line follows the unit's newest command, whoever sent
  // it; the ordering guard in writeCmdLine keeps this from
  // ever moving the line backwards.
  try {
    const { data, error } = await eps().from("commands")
      .select("id, command_type, state, result, delivery_seq")
      .eq("system_unit_id", unitId)
      .order("delivery_seq", { ascending: false }).limit(1);
    if (!error && data && data.length) {
      const c = data[0];
      writeCmdLine(unitId, {
        id: c.id, seq: c.delivery_seq, type: c.command_type,
        state: c.state, code: c.result && c.result.code,
      });
    }
  } catch (e) { /* the standing line stays as it was */ }
  // A command resolving — above all a disable or enable —
  // can change the flag the row presents; re-read it on the
  // same cycle.
  await refreshUnitFlag(unitId);
  if ((mine && CMD_TERMINAL[mine.state]) || tr.polls >= CMD_POLL_MAX) {
    // Terminal: following ends. Bound reached without one:
    // following ends too, and the last known state stands —
    // no error, and nothing is fabricated.
    delete trackedCmds[cmdId];
    return;
  }
  tr.timer = setTimeout(() => pollCommand(cmdId), CMD_POLL_MS);
}

async function sendCommand(btn) {
  const unitId = btn.dataset.unit;
  const type = btn.dataset.cmd;
  if (!actorId) {
    setCmdLine(unitId, "SIGN-IN EXPIRED — RELOAD THE PAGE", true);
    return;
  }
  const payload = type === "start_session"
    ? { platform: unitPlatform[unitId] || "apple_music" }
    : {};
  const pressId = unitId + "|" + type;
  if (!pressKeys[pressId]) {
    pressKeys[pressId] = (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : "dash-" + Date.now() + "-" + Math.random().toString(36).slice(2);
  }
  btn.disabled = true;
  try {
    const { data, error } = await client.functions.invoke("eps-unit-command", {
      body: {
        system_unit_id: unitId,
        command_type: type,
        payload: payload,
        idempotency_key: pressKeys[pressId],
      },
    });
    if (error) {
      // The boundary answers a coded refusal as { code } on the
      // response body; supabase-js surfaces a non-200 as an
      // error whose context is that response. A coded refusal
      // is a definitive answer: the press is over and its key
      // is retired. Any other failure is ambiguous (the command
      // may or may not stand), so the key is KEPT — a retry
      // then returns the standing command instead of sending a
      // second one. Raw error detail is never shown.
      let code = "";
      try {
        const respBody = error.context
          ? await error.context.json() : null;
        if (respBody && typeof respBody.code === "string") {
          code = respBody.code;
        }
      } catch (e) { /* no coded body — the failure stays ambiguous */ }
      if (code === "P0523") {
        delete pressKeys[pressId];
        setCmdLine(unitId, "NOT PERMITTED FOR THIS ACCOUNT", true);
      } else if (code === "P0524") {
        delete pressKeys[pressId];
        setCmdLine(unitId, "THAT COMMAND WAS NOT VALID", true);
      } else if (code === "P0525") {
        delete pressKeys[pressId];
        setCmdLine(unitId, "ALREADY RECORDED — NOT SENT TWICE", true);
      } else {
        setCmdLine(unitId, "COULD NOT SEND — PLEASE TRY AGAIN", true);
      }
      return;
    }
    delete pressKeys[pressId];
    const rec = { type, state: data ? data.command_state : "pending", code: null };
    sentCmds[unitId] = rec;
    const cmdId = data && data.command_id ? String(data.command_id) : null;
    if (cmdId) lineShown[unitId] = { id: cmdId, seq: null };
    setCmdLine(unitId, cmdLineText(rec), false);
    // Follow this command under its own id until it resolves:
    // the phone picks it up at a check-in, may acknowledge it
    // at one and complete it at the next.
    if (cmdId && !CMD_TERMINAL[rec.state]) trackCommand(unitId, cmdId);
  } catch (e) {
    setCmdLine(unitId, "COULD NOT SEND — PLEASE TRY AGAIN", true);
  } finally {
    btn.disabled = false;
  }
}

// The queue reset (Part 4): a two-press control. The first
// press arms it — the button itself becomes CONFIRM RESET? for
// a few seconds, then quietly reverts; the second press sends.
// The result lands on the unit's own status line, where the
// command lines already live.
async function resetQueue(btn) {
  const unitId = btn.dataset.reset;
  if (!actorId) {
    setCmdLine(unitId, "SIGN-IN EXPIRED — RELOAD THE PAGE", true);
    return;
  }
  if (btn.dataset.confirming !== "1") {
    btn.dataset.confirming = "1";
    btn.textContent = "CONFIRM RESET?";
    btn.classList.add("confirming");
    clearTimeout(resetTimers[unitId]);
    resetTimers[unitId] = setTimeout(() => {
      btn.dataset.confirming = "";
      btn.textContent = "RESET QUEUE";
      btn.classList.remove("confirming");
    }, 4000);
    return;
  }
  clearTimeout(resetTimers[unitId]);
  btn.dataset.confirming = "";
  btn.classList.remove("confirming");
  btn.disabled = true;
  try {
    const { data, error } = await client.functions.invoke("eps-unit-command", {
      body: { action: "reset_queue", system_unit_id: unitId },
    });
    if (error) {
      // The boundary's coded refusal, read exactly as
      // sendCommand reads it; raw error detail is never shown.
      let code = "";
      try {
        const respBody = error.context
          ? await error.context.json() : null;
        if (respBody && typeof respBody.code === "string") {
          code = respBody.code;
        }
      } catch (e) { /* no coded body — the generic line stands */ }
      if (code === "P0523") {
        setCmdLine(unitId, "NOT PERMITTED FOR THIS ACCOUNT", true);
      } else {
        setCmdLine(unitId, "COULD NOT RESET — PLEASE TRY AGAIN", true);
      }
      return;
    }
    const n = data && typeof data.expired_count === "number"
      ? data.expired_count : 0;
    setCmdLine(unitId, n > 0
      ? "QUEUE RESET · " + n + " CLEARED"
      : "QUEUE ALREADY EMPTY", false);
  } catch (e) {
    setCmdLine(unitId, "COULD NOT RESET — PLEASE TRY AGAIN", true);
  } finally {
    btn.disabled = false;
    btn.textContent = "RESET QUEUE";
  }
}

// Summary-card expansion (Part 4): the body shows when the
// operator's choice OR a standing search force says so; the
// chevron and aria state follow the same answer.
function applyOrgExpansion(orgId) {
  const expanded = !!orgExpanded[orgId] || searchForce.has(orgId);
  const body = document.getElementById("orgbody-" + orgId);
  if (body) body.hidden = !expanded;
  const btn = document.querySelector("[data-summary='" + orgId + "']");
  if (btn) btn.setAttribute("aria-expanded", expanded ? "true" : "false");
  const chev = document.getElementById("chev-" + orgId);
  if (chev) chev.textContent = expanded ? "▾" : "▸";
}

function toggleOrg(orgId) {
  const nowExpanded = !!orgExpanded[orgId] || searchForce.has(orgId);
  orgExpanded[orgId] = !nowExpanded;
  if (nowExpanded) searchForce.delete(orgId);
  applyOrgExpansion(orgId);
}

// Search (Part 4): filter as you type. A card carries its
// search text (company name + every unit's label and key) in
// data-search and its company name alone in data-name: a name
// match filters, and a UNIT match additionally holds its
// company open while the query stands. Clearing the query
// restores every card and the operator's own expansion states.
function applySearch() {
  const input = document.getElementById("fleetSearch");
  const q = (input.value || "").trim().toLowerCase();
  searchForce.clear();
  let total = 0, visible = 0;
  document.querySelectorAll("[data-search]").forEach(card => {
    total++;
    const matches = q === "" || card.dataset.search.includes(q);
    card.hidden = !matches;
    if (matches) {
      visible++;
      if (q !== "" && !(card.dataset.name || "").includes(q)) {
        searchForce.add(card.dataset.org);
      }
    }
  });
  renderedOrgs.forEach(applyOrgExpansion);
  const noMatch = document.getElementById("noMatch");
  if (noMatch) noMatch.hidden = !(q !== "" && total > 0 && visible === 0);
}

function moneyRain() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const layer = document.createElement("div");
  layer.className = "rain";
  for (let i = 0; i < 36; i++) {
    const c = document.createElement("div");
    c.className = "coin";
    const size = 13 + Math.random() * 14;
    c.style.width = size + "px";
    c.style.height = size + "px";
    c.style.left = (Math.random() * 100) + "vw";
    c.style.animationDuration = (1.8 + Math.random() * 1.4) + "s";
    c.style.animationDelay = (Math.random() * 0.6) + "s";
    c.style.opacity = 0.75 + Math.random() * 0.25;
    if (i % 3 === 0) {
      c.textContent = "$";
      c.style.fontSize = (size * 0.62) + "px";
    }
    layer.appendChild(c);
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 4200);
}

// The CURRENT UTC MONTH's bounds, passed to the server-side
// usage aggregate. usage_daily buckets are UTC days, so the
// month the line names is the buckets' own month: the range
// is [first day of this UTC month, first day of the next),
// computed in UTC — never the browser's local month edge,
// which could sit a day either side of the buckets it sums.
function usageMonthBounds() {
  const d = new Date();
  const isoDay = t => t.toISOString().slice(0, 10);
  return {
    start: isoDay(new Date(Date.UTC(
      d.getUTCFullYear(), d.getUTCMonth(), 1))),
    end: isoDay(new Date(Date.UTC(
      d.getUTCFullYear(), d.getUTCMonth() + 1, 1))),
  };
}

async function loadFleet(user) {
  hide("signin"); show("fleet");
  actorId = user.id;
  document.getElementById("who").textContent =
    (user.user_metadata && user.user_metadata.display_name) || user.email;
  const err = document.getElementById("fleetErr");
  err.textContent = "";
  // Every read's error is checked (TA's Step 8C review finding):
  // a failed read is surfaced by name and its figures render as
  // unknown — never silently treated as empty or healthy.
  const reads = await Promise.all([
      eps().from("organizations").select("id, slug, display_name, is_root_authority, is_test").order("display_name"),
      eps().from("system_units").select("id, organization_id, unit_key, status, operator_disabled"),
      eps().from("fleet_label_assignments").select("system_unit_id, label").is("unassigned_at", null),
      eps().from("unit_runtime_state").select("system_unit_id, current_platform, updated_at, local_disabled, reported_platform, conducting, current_entry, last_checkin_at"),
      eps().from("heartbeats").select("system_unit_id, recorded_at").order("recorded_at", { ascending: false }).limit(500),
      eps().from("billing_periods").select("organization_id, service_month, billing_state").order("service_month", { ascending: false }),
      eps().from("notice_outbox").select("organization_id, state"),
      eps().from("physical_installations").select("system_unit_id, status, app_version_name, app_version_reported_at"),
    ]);
  const names = ["organizations", "units", "labels", "runtime state",
                 "heartbeats", "billing periods", "notices", "installations"];
  const failed = names.filter((_, i) => reads[i].error);
  const unitsFailed = !!reads[1].error;
  const noticesFailed = !!reads[6].error;
  const [orgs, units, labels, runtime, beats, periods, notices, installations] =
    reads.map(r => r.data);
  if (reads[0].error) { err.textContent = reads[0].error.message; return; }
  if (failed.length) {
    err.textContent = "Some data could not be loaded (" +
      failed.join(", ") + ") — what is shown may be incomplete.";
  }
  // Account state comes from the system's own computation
  // (eps.account_org_entitlement_state), one call per visible
  // organization; a failed or empty answer renders "unknown".
  const stateOf = {};
  await Promise.all((orgs || []).map(async org => {
    const { data, error } = await eps().rpc(
      "account_org_entitlement_state", { p_organization_id: org.id });
    stateOf[org.id] = error ? null : data;
  }));
  // Recent commands, newest first, for the control status
  // lines (eps.commands is in the account's read surface since
  // migration 20261103200000, scoped to the organizations the
  // account may see). A separate, quiet read: if it fails it
  // yields nothing — no banner, and no state is ever fabricated
  // for the lines.
  let cmdRows = [];
  try {
    const cmdRead = await eps().from("commands")
      .select("id, system_unit_id, command_type, state, result, delivery_seq")
      .order("delivery_seq", { ascending: false }).limit(200);
    if (!cmdRead.error) cmdRows = cmdRead.data || [];
  } catch (e) { cmdRows = []; }
  const latestCmd = {};
  cmdRows.forEach(c => {
    if (!latestCmd[c.system_unit_id]) {
      latestCmd[c.system_unit_id] = {
        id: c.id, seq: c.delivery_seq,
        type: c.command_type, state: c.state,
        code: c.result && c.result.code,
      };
    }
  });
  const labelOf = {}, runtimeOf = {}, periodOf = {}, noticeCount = {};
  (labels || []).forEach(r => { labelOf[r.system_unit_id] = r.label; });
  (runtime || []).forEach(r => { runtimeOf[r.system_unit_id] = r; });
  // (The heartbeats read above stays in the read set — its
  // failure is still surfaced by name — but nothing renders
  // from it since Part 3: the table has never had a writer,
  // and Last activity now renders the server-stamped
  // last_checkin_at instead.)
  // The app version and the silence test read the installations
  // (Part 3): the version is the one the unit's ACTIVE
  // installation most recently reported at check-in; a unit
  // counts as installed — and so can stand silent — only while
  // an active installation exists.
  const versionOf = {}, activeInstall = {};
  (installations || []).forEach(r => {
    if (r.status !== "active") return;
    activeInstall[r.system_unit_id] = true;
    const cur = versionOf[r.system_unit_id];
    if (!cur || String(r.app_version_reported_at || "") > String(cur.at || "")) {
      versionOf[r.system_unit_id] = { name: r.app_version_name, at: r.app_version_reported_at };
    }
  });
  (periods || []).forEach(r => { if (!periodOf[r.organization_id]) periodOf[r.organization_id] = r; });
  (notices || []).forEach(r => {
    if (r.state !== "sent") noticeCount[r.organization_id] = (noticeCount[r.organization_id] || 0) + 1;
  });
  // Usage (Part 4; server-side aggregate since the correction):
  // this month's counted check-ins, one eps.usage_month_checkins
  // call per company over the current UTC month's bounds. The
  // total comes back exact from the server; a failed call leaves
  // the company null and its line renders UNKNOWN below — never
  // a fabricated figure.
  const usageOf = {};
  const monthBounds = usageMonthBounds();
  await Promise.all((orgs || []).map(async org => {
    const { data, error } = await eps().rpc(
      "usage_month_checkins", {
        p_organization_id: org.id,
        p_month_start: monthBounds.start,
        p_month_end: monthBounds.end,
      });
    usageOf[org.id] = error ? null : Number(data);
  }));

  const host = document.getElementById("orgs");
  host.innerHTML = "";
  renderedOrgs = [];
  const alertsHost = document.getElementById("alerts");
  alertsHost.innerHTML = "";
  alertsHost.hidden = true;
  if (!orgs || orgs.length === 0) {
    host.innerHTML = '<div class="card">This account has no access.' +
      '<div class="note">Access is granted by membership — ask the operator to provision this account.</div></div>';
    return;
  }
  const alerts = [];
  // Test organizations (designated in the data, S6B) are kept
  // out of the fleet view; the exclusion itself is shown, never
  // silent. Their records stay in the system untouched.
  const testCount = orgs.filter(o => o.is_test).length;
  const fleets = orgs.filter(o => !o.is_test);
  fleets.forEach(org => {
    // Critical alerts (Part 3), organization level: the billing
    // states the account-state read already computes. Part 4
    // counts each company's alerts as they are collected — the
    // count rides the company's summary line.
    let orgAlerts = 0;
    const pushAlert = line => { alerts.push(line); orgAlerts++; };
    const orgState = stateOf[org.id];
    if (orgState === "suspended") {
      pushAlert(esc(org.display_name) + " — BILLING SUSPENDED");
    }
    if (orgState === "revoked") {
      pushAlert(esc(org.display_name) + " — ACCESS REVOKED");
    }
    const orgUnits = (units || []).filter(u => u.organization_id === org.id);
    const statusWords = [];  // each unit's standing word, for the summary counts
    const unitSearch = [];   // each unit's label and key, for the search text
    const rows = orgUnits.map(u => {
      const rt = runtimeOf[u.id] || {};
      // The unit's platform seeds the START override, in the
      // payload's own vocabulary ('apple_music' | 'youtube'):
      // the phone's REPORTED platform first (Part 3), the
      // recorded platform behind it.
      const seedPlatform = rt.reported_platform || rt.current_platform;
      const plat = seedPlatform === "youtube" ? "youtube" : "apple_music";
      unitPlatform[u.id] = plat;
      const dis = !!u.operator_disabled;
      unitDisabled[u.id] = dis;
      const cmd = latestCmd[u.id] || sentCmds[u.id];
      if (latestCmd[u.id]) {
        lineShown[u.id] = { id: latestCmd[u.id].id, seq: latestCmd[u.id].seq };
      }
      const st = unitStatusOf(u, rt);
      statusWords.push(st.word);
      unitSearch.push(labelOf[u.id] || u.unit_key, u.unit_key);
      const statusHtml = esc(st.word) +
        (st.entry ? "<div class='sub-line'>" + esc(st.entry) + "</div>" : "");
      unitStatusHtml[u.id] = statusHtml;
      const ver = versionOf[u.id];
      // Critical alerts (Part 3), unit level — each line names
      // the company and the unit and states the condition in
      // plain words.
      const unitName = esc(org.display_name) + " · " +
        esc(labelOf[u.id] || u.unit_key);
      if ((orgState === "active" || orgState === "owner" ||
           orgState === "past_due") && activeInstall[u.id]) {
        if (!rt.last_checkin_at) {
          pushAlert(unitName + " — HAS NOT CHECKED IN (NO RECORD)");
        } else {
          const silentFor = Date.now() - Date.parse(rt.last_checkin_at);
          if (silentFor > UNIT_SILENCE_MS) {
            pushAlert(unitName + " — NO CHECK-IN FOR " +
              durationWords(silentFor));
          }
        }
      }
      const latest = latestCmd[u.id];
      if (latest && latest.state === "failed") {
        pushAlert(unitName + " — " +
          (CMD_LABEL[latest.type] || String(latest.type).toUpperCase()) +
          " COMMAND FAILED" +
          (latest.code ? " · " + esc(latest.code) : ""));
      }
      if (dis) {
        pushAlert(unitName + " — DISABLED FROM THE DASHBOARD");
      } else if (rt.local_disabled) {
        pushAlert(unitName + " — DISABLED ON THE DEVICE");
      }
      return "<tr><td>" + esc(labelOf[u.id] || u.unit_key) +
        "<span id='unitbadge-" + esc(u.id) + "'>" +
          (dis ? "<span class='badge'>DISABLED</span>" : "") + "</span>" +
          (ver && ver.name ? "<div class='ver'>v" + esc(ver.name) + "</div>" : "") + "</td>" +
        "<td id='statuscell-" + esc(u.id) + "'>" + statusHtml + "</td>" +
        "<td class='dim'>" + esc(platLabel(rt.reported_platform || rt.current_platform)) + "</td>" +
        "<td class='dim'>" + esc(lastActivityText(rt)) + "</td></tr>" +
        "<tr class='ctl-row'><td colspan='4'><div class='ctl'>" +
        "<span class='seg' data-seg='" + esc(u.id) + "'>" +
          "<button type='button' data-plat='apple_music'" +
            (plat === "apple_music" ? " class='on'" : "") + ">APPLE MUSIC</button>" +
          "<button type='button' data-plat='youtube'" +
            (plat === "youtube" ? " class='on'" : "") + ">YOUTUBE</button>" +
        "</span>" +
        "<button type='button' class='ctl-btn" + (dis ? "" : " primary") +
          "' id='startbtn-" + esc(u.id) +
          "' data-cmd='start_session' data-unit='" + esc(u.id) + "'>START SESSION</button>" +
        "<button type='button' class='ctl-btn' data-cmd='stop_session' data-unit='" +
          esc(u.id) + "'>STOP SESSION</button>" +
        "<button type='button' class='ctl-btn' data-cmd='restart_runtime' data-unit='" +
          esc(u.id) + "'>RESTART RUNTIME</button>" +
        (dis
          ? "<button type='button' class='ctl-btn primary' id='flagbtn-" + esc(u.id) +
              "' data-cmd='enable_unit' data-unit='" +
              esc(u.id) + "'>ENABLE UNIT</button>"
          : "<button type='button' class='ctl-btn' id='flagbtn-" + esc(u.id) +
              "' data-cmd='disable_unit' data-unit='" +
              esc(u.id) + "'>DISABLE UNIT</button>") +
        "<button type='button' class='ctl-btn quiet reset' id='resetbtn-" +
          esc(u.id) + "' data-reset='" + esc(u.id) + "'>RESET QUEUE</button>" +
        "</div><div class='cmd-line' id='cmd-" + esc(u.id) + "'>" +
          esc(cmdLineText(cmd)) + "</div></td></tr>";
    }).join("");
    const period = periodOf[org.id];
    const billing = org.is_root_authority
      ? "Owner organization — not billed"
      : (periods === null ? "unknown"
        : (period ? esc(period.service_month) + " · " + esc(period.billing_state)
                  : "No billing period yet"));
    const accountState = stateOf[org.id] === "owner"
      ? "owner authority"
      : (stateOf[org.id] || "unknown");
    // The summary line's counts (Part 4): the unit count, then
    // the standing states in the order an operator scans them —
    // playing, ready, disabled (both disable words count as
    // DISABLED) — then any other lifecycle word in the order
    // met, then the alert count when any stand.
    const stateCounts = {};
    statusWords.forEach(w => {
      const key = w.indexOf("DISABLED") === 0 ? "DISABLED" : w;
      stateCounts[key] = (stateCounts[key] || 0) + 1;
    });
    const countParts = [orgUnits.length +
      (orgUnits.length === 1 ? " UNIT" : " UNITS")];
    ["PLAYING", "READY", "DISABLED"].forEach(k => {
      if (stateCounts[k]) countParts.push(stateCounts[k] + " " + k);
    });
    Object.keys(stateCounts).forEach(k => {
      if (k !== "PLAYING" && k !== "READY" && k !== "DISABLED") {
        countParts.push(stateCounts[k] + " " + k);
      }
    });
    if (orgAlerts > 0) {
      countParts.push(orgAlerts + (orgAlerts === 1 ? " ALERT" : " ALERTS"));
    }
    // The calm default (Part 4): a company stands expanded only
    // with an alert standing or a unit playing. An operator's
    // own choice, once made, stands across fleet reloads.
    if (!(org.id in orgExpanded)) {
      orgExpanded[org.id] = orgAlerts > 0 || !!stateCounts["PLAYING"];
    }
    const expanded = !!orgExpanded[org.id] || searchForce.has(org.id);
    // The usage line (Part 4): this month's counted check-ins
    // against the allotment, with the thin gold bar under it. A
    // failed usage call renders UNKNOWN — never a figure.
    let usageHtml;
    if (usageOf[org.id] == null) {
      usageHtml = "<div class='usage'><div class='usage-line'>" +
        "USAGE — UNKNOWN</div></div>";
    } else {
      const used = usageOf[org.id];
      const pct = Math.min(100, (100 * used) / USAGE_ALLOTMENT);
      usageHtml = "<div class='usage'><div class='usage-line'>USAGE — " +
        used.toLocaleString("en-US") + " / " +
        USAGE_ALLOTMENT.toLocaleString("en-US") +
        " CHECK-INS THIS MONTH</div>" +
        "<div class='usage-bar'><div class='usage-fill' style='width:" +
        pct + "%'></div></div></div>";
    }
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.org = org.id;
    card.dataset.name = String(org.display_name || "").toLowerCase();
    card.dataset.search = (String(org.display_name || "") + " " +
      unitSearch.join(" ")).toLowerCase();
    card.innerHTML =
      "<button type='button' class='org-summary' data-summary='" +
        esc(org.id) + "' aria-expanded='" + (expanded ? "true" : "false") + "'>" +
        "<span class='org-name'>" + esc(org.display_name) + "</span>" +
        "<span class='org-counts'>" + esc(countParts.join(" · ")) + "</span>" +
        "<span class='chev' id='chev-" + esc(org.id) + "'>" +
          (expanded ? "▾" : "▸") + "</span>" +
      "</button>" +
      "<div class='org-body' id='orgbody-" + esc(org.id) + "'" +
        (expanded ? "" : " hidden") + ">" +
      "<div class='orgkind'>" + (org.is_root_authority ? "Owner" : "Client") +
        " · Account: " + esc(accountState) +
        " · Billing: " + billing +
        (noticesFailed ? " · Unsent notices: unknown"
          : (noticeCount[org.id] ? " · Unsent notices: " + noticeCount[org.id] : "")) +
      "</div>" +
      usageHtml +
      (unitsFailed
        ? "<div class='note'>Units unavailable — the units read failed.</div>"
        : (rows
          ? "<table><tr><th>Unit</th><th>Status</th><th>Platform</th><th>Last activity</th></tr>" + rows + "</table>"
          : "<div class='note'>No units yet.</div>")) +
      "</div>";
    host.appendChild(card);
    renderedOrgs.push(org.id);
  });
  // The alerts area exists only while a condition stands.
  if (alerts.length) {
    alertsHost.innerHTML = "<div class='alert-title'>ALERTS</div>" +
      alerts.map(a => "<div class='alert-line'>" + a + "</div>").join("");
    alertsHost.hidden = false;
  }
  // Control wiring: command buttons send; the segmented
  // control only chooses the platform the next START carries.
  host.querySelectorAll("[data-cmd]").forEach(btn => {
    btn.addEventListener("click", () => sendCommand(btn));
  });
  host.querySelectorAll("[data-seg]").forEach(seg => {
    seg.querySelectorAll("button").forEach(b => {
      b.addEventListener("click", () => {
        unitPlatform[seg.dataset.seg] = b.dataset.plat;
        seg.querySelectorAll("button").forEach(x =>
          x.classList.toggle("on", x === b));
      });
    });
  });
  // Part 4 wiring: the quiet reset control and the summary
  // lines' expand/collapse.
  host.querySelectorAll("[data-reset]").forEach(btn => {
    btn.addEventListener("click", () => resetQueue(btn));
  });
  host.querySelectorAll("[data-summary]").forEach(btn => {
    btn.addEventListener("click", () => toggleOrg(btn.dataset.summary));
  });
  // A query still standing in the search field (the operator
  // typed, then the fleet reloaded) re-applies to the fresh
  // cards — filtering and force-expansion alike.
  applySearch();
  // Test organizations stay excluded from the display, silently —
  // at Anthony's direction (October 29, 2026) the "not shown" line
  // itself was removed from the page. The count is still computed
  // above; nothing about the exclusion changed, only its announcement.
}

async function boot() {
  const err = document.getElementById("signinErr");
  if (!window.supabase) {
    show("signin");
    err.textContent = "The sign-in library could not be loaded — check your connection and reopen the page.";
    return;
  }
  if (cfg.usernameSignIn) {
    document.getElementById("emailLabel").textContent = "Username";
  }
  if (!configured) {
    show("signin");
    err.textContent =
      "Dashboard not configured yet — the project anon key goes in config.js.";
    return;
  }
  try {
    const { data: { session } } = await client.auth.getSession();
    if (session) loadFleet(session.user); else show("signin");
  } catch (e) {
    show("signin");
    err.textContent = "Could not reach the sign-in service: " + (e && e.message ? e.message : e);
  }
}

document.getElementById("pwToggle").addEventListener("click", () => {
  const pw = document.getElementById("password");
  const showing = pw.type === "text";
  pw.type = showing ? "password" : "text";
  const btn = document.getElementById("pwToggle");
  btn.textContent = showing ? "Show" : "Hide";
  btn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
});

document.getElementById("signinBtn").addEventListener("click", async () => {
  const err = document.getElementById("signinErr");
  const btn = document.getElementById("signinBtn");
  err.textContent = "";
  if (!client) {
    err.textContent = "Dashboard not configured yet — the project anon key goes in config.js.";
    return;
  }
  btn.disabled = true;
  btn.textContent = "Signing in…";
  try {
    // Sign-in is by email, or — once the username gate is live
    // and config enables it — by USERNAME ONLY (Anthony's
    // decision, October 29, 2026): with usernameSignIn on, the
    // form is Username + Password and this function path is the
    // ONLY path; the email field and the direct email sign-in
    // below are not reachable. A username is one word (his
    // rule): the field shows exactly what was typed, and the
    // value is lowercased only here, in the request — the
    // one-word rule itself is enforced on the server, which
    // refuses any whitespace with the same generic failure. The
    // username goes WITH the password to the eps-username-signin
    // function, which resolves the account email on the server
    // and performs the password check there. The function
    // returns only the minimal session fields and never returns
    // the account email or the Auth user object; the form is
    // username-only and displays no email (after sign-in the
    // Supabase client holds the standard Auth session state,
    // exactly as with email sign-in). Every failure — unknown
    // username or wrong password — returns the same generic
    // message.
    // (TA's condition on PR #51: no anon-callable email lookup;
    // the audited anon boundary holds.)
    const identifier = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if (cfg.usernameSignIn) {
      const username = identifier.toLowerCase();
      const resp = await fetch(cfg.url + "/functions/v1/eps-username-signin", {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": cfg.anonKey },
        body: JSON.stringify({ username, password }),
      });
      const payload = await resp.json().catch(() => null);
      if (!resp.ok || !payload || !payload.access_token || !payload.refresh_token) {
        err.textContent = "Invalid login credentials";
        return;
      }
      const session = await client.auth.setSession({
        access_token: payload.access_token,
        refresh_token: payload.refresh_token,
      });
      if (session.error || !session.data.user) {
        err.textContent = "Invalid login credentials";
        return;
      }
      await loadFleet(session.data.user);
      return;
    }
    const { data, error } = await client.auth.signInWithPassword({
      email: identifier,
      password: document.getElementById("password").value,
    });
    if (error) {
      err.textContent = error.message;
      return;
    }
    if (!data || !data.user) {
      err.textContent = "Sign-in did not complete — please try again.";
      return;
    }
    await loadFleet(data.user);
  } catch (e) {
    err.textContent = "Sign-in failed: " + (e && e.message ? e.message : e);
  } finally {
    btn.disabled = false;
    btn.textContent = "Sign in";
  }
});
// The Wizard (Anthony's feature, October 29, 2026): a button in
// the footbar that opens a small, bare card holding ONE sentence
// of his, set in config (wizardText / wizardVersion). It changes
// only when he changes it. A gold dot rests on the button while
// the current sentence is unseen on this device; reading clears
// it. Visible to every signed-in account - built mostly for the
// client, seen by the owner too (his direction).
(function initWizard() {
  const text = (cfg.wizardText || "").trim();
  if (!text || !cfg.wizardVersion) return;
  const btn = document.getElementById("wizardBtn");
  const dot = document.getElementById("wizardDot");
  const overlay = document.getElementById("wizardOverlay");
  document.getElementById("wizardText").textContent = text;
  btn.hidden = false;
  let seen = 0;
  try { seen = Number(localStorage.getItem("epsWizardSeen") || 0); } catch (e) {}
  if (seen < cfg.wizardVersion) dot.hidden = false;
  btn.addEventListener("click", () => {
    overlay.hidden = false;
    dot.hidden = true;
    try { localStorage.setItem("epsWizardSeen", String(cfg.wizardVersion)); } catch (e) {}
  });
  overlay.addEventListener("click", () => { overlay.hidden = true; });
  document.getElementById("wizardClose").addEventListener("click", (ev) => {
    ev.stopPropagation();
    overlay.hidden = true;
  });
})();

// The top-right menu (Anthony's layout, October 29, 2026): one
// small button holds The Wizard, Gold Rush, and Sign out, so the
// page body stays clear for the company cards and the controls
// that will one day live on them. Any item click closes the menu;
// a click anywhere outside closes it too.
(function initMenu() {
  const btn = document.getElementById("menuBtn");
  const panel = document.getElementById("menuPanel");
  btn.addEventListener("click", (ev) => {
    ev.stopPropagation();
    panel.hidden = !panel.hidden;
  });
  panel.addEventListener("click", () => { panel.hidden = true; });
  document.addEventListener("click", (ev) => {
    if (!panel.hidden && !ev.target.closest(".menu-wrap")) panel.hidden = true;
  });
})();

document.getElementById("rainBtn").addEventListener("click", moneyRain);

// Download the app (Step 9 Part 1, Anthony's design, October 29,
// 2026): the signed-in account downloads the current production
// build from inside the dashboard. The button asks the
// eps-download function — with this session's own token — for
// the current release's short-lived signed URL and opens it.
// Membership is the authorization (the function checks it
// server-side); the signed-out view never sees this button
// because the menu lives in the fleet view.
//
// The handoff is gesture-safe: mobile browsers block a
// window.open that happens after an await, when the click's
// gesture has expired, so the handler opens a placeholder tab
// SYNCHRONOUSLY — before any await — and points that tab at the
// signed URL when it arrives. On failure the placeholder is
// closed and the error shows here, as before; if the placeholder
// itself was blocked (window.open returned null), the signed URL
// is handed off through a programmatically created anchor
// instead.
document.getElementById("downloadBtn").addEventListener("click", async (ev) => {
  const btn = ev.currentTarget;
  const err = document.getElementById("fleetErr");
  err.textContent = "";
  btn.disabled = true;
  const label = btn.textContent;
  btn.textContent = "Preparing download…";
  // Inside the click gesture, before any await: the tab the
  // download will land in.
  const tab = window.open("", "_blank");
  const abandonTab = () => { if (tab && !tab.closed) tab.close(); };
  try {
    const { data } = await client.auth.getSession();
    const token = data && data.session ? data.session.access_token : null;
    if (!token) {
      abandonTab();
      err.textContent = "Sign-in session expired — please sign in again.";
      return;
    }
    const resp = await fetch(cfg.url + "/functions/v1/eps-download", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": cfg.anonKey,
        "Authorization": "Bearer " + token,
      },
    });
    const payload = await resp.json().catch(() => null);
    if (!resp.ok || !payload || !payload.download_url) {
      abandonTab();
      err.textContent = resp.status === 404
        ? "No production build is published yet."
        : "Download failed — please try again.";
      return;
    }
    if (tab) {
      tab.location = payload.download_url;
    } else {
      const a = document.createElement("a");
      a.href = payload.download_url;
      a.target = "_blank";
      a.rel = "noopener";
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
  } catch (e) {
    abandonTab();
    err.textContent = "Download failed: " + (e && e.message ? e.message : e);
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
});

document.getElementById("signoutBtn").addEventListener("click", async () => {
  await client.auth.signOut();
  location.reload();
});

// Search (Step 7 Part 4): filter companies and units by name
// as you type.
document.getElementById("fleetSearch").addEventListener("input", applySearch);
boot();
